services:
  postgres:
    image: postgres:16-alpine
    container_name: workbridge_postgres
    restart: always
    environment:
      POSTGRES_USER: workbridge_admin
      POSTGRES_PASSWORD: workbridge_secret_password
      POSTGRES_DB: workbridge_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: workbridge_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: